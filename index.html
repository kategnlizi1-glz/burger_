
<!doctype html>
<html lang="en">
  <head>
    <title>Model Viewer</title>
    <meta charset="utf-8">
    <meta name="description" content="Model Viewer Animation">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>

  <body>
    <model-viewer
      id="gear"
      src="BURGER TEST ANIMATION.glb"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      tone-mapping="neutral"
      poster="poster.png"
      shadow-intensity="1"
      camera-orbit="314deg 76.78deg 0.1755m"
      field-of-view="30deg">


      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>

      <div style="position:absolute; bottom:0px; right:0px">
        <button onclick="playModel()">
          Click to Play
        </button>
      </div>

      <button slot="ar-button" id="ar-button">
        View in your space
      </button>

  
      <div id="ar-prompt">
        <img src="ar_hand_prompt.png">
      </div>

    </model-viewer>

    <script>
      function playModel() {
        const modelViewer = document.getElementById('gear');

        modelViewer.play({
          repetitions: 0,
          pingpong: true
        });
      }
    </script>

    <script src="script.js"></script>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
    </script>

  </body>
</html>
